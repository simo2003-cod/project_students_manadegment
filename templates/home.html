<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(to bottom right, #eff6ff, #e0e7ff);
            padding: 2rem;
        }

        .container {
            max-width: 72rem;
            margin: 0 auto;
            margin-top: 2rem;
        }

        /* Header Styles */
        .header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .header-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .header-icon svg {
            width: 4rem;
            height: 4rem;
            color: #4f46e5;
            animation: scalePulse 2s ease-in-out infinite;
        }

        @keyframes scalePulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #111827;
            font-weight: 700;
        }

        .header p {
            font-size: 1.25rem;
            color: #4b5563;
        }

        /* Grid Layout */
        .features-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (min-width: 768px) {
            .features-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Card Styles */
        .card {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.3s ease;
            overflow: hidden;
        }

        .card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .card.clickable {
            cursor: pointer;
        }

        .card-header {
            padding: 1.5rem;
        }

        .icon-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 3rem;
            height: 3rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }

        .icon-container.green {
            background-color: #dcfce7;
        }

        .icon-container.blue {
            background-color: #dbeafe;
        }

        .icon-container.purple {
            background-color: #f3e8ff;
        }

        .icon-container svg {
            width: 1.5rem;
            height: 1.5rem;
        }

        .icon-container.green svg {
            color: #16a34a;
        }

        /* Green Icon Animation - Glow Pulse */
        .icon-container.green {
            animation: glowPulseGreen 2s ease-in-out infinite;
        }

        @keyframes glowPulseGreen {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.4);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(22, 163, 74, 0);
            }
        }

        .icon-container.blue svg {
            color: #2563eb;
        }

        /* Blue Icon Animation - Glow Pulse */
        .icon-container.blue {
            animation: glowPulseBlue 2s ease-in-out infinite;
        }

        @keyframes glowPulseBlue {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(37, 99, 235, 0);
            }
        }

        .icon-container.purple svg {
            color: #9333ea;
        }

        /* Icon Animation */
        .icon-container.purple {
            animation: glowPulsePurple 2s ease-in-out infinite;
        }

        @keyframes glowPulsePurple {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(147, 51, 234, 0.4);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(147, 51, 234, 0);
            }
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #111827;
            margin-bottom: 0.5rem;
        }

        .card-description {
            font-size: 0.875rem;
            color: #6b7280;
        }

        .card-content {
            padding: 0 1.5rem 1.5rem 1.5rem;
        }

        /* Button Styles */
        .button {
            width: 100%;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: white;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .button.green {
            background-color: #16a34a;
        }

        .button.green:hover {
            background-color: #15803d;
        }

        .button.blue {
            background-color: #2563eb;
        }

        .button.blue:hover {
            background-color: #1d4ed8;
        }

        /* Stats Styles */
        .stats {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
        }

        .stat-label {
            color: #4b5563;
        }

        .stat-value {
            color: #111827;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                </svg>
            </div>
            <h1>Student Management System</h1>
            <p>Manage student information efficiently and effectively</p>
        </div>

        <!-- Features Grid -->
        <div class="features-grid">
            <!-- Add Student Card -->
            <div class="card clickable" onclick="window.location.href = '/add_student' ">
                <div class="card-header">
                    <div class="icon-container green">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <line x1="19" x2="19" y1="8" y2="14"></line>
                            <line x1="22" x2="16" y1="11" y2="11"></line>
                        </svg>
                    </div>
                    <h2 class="card-title">Add Student</h2>
                    <p class="card-description">Register a new student in the system</p>
                </div>
                <div class="card-content">
                    <button class="button green" onclick="window.location.href = '/add_student' ">Add New Student</button>
                </div>
            </div>

            <!-- Students List Card -->
            <div class="card clickable" onclick="window.location.href = '/students'">
                <div class="card-header">
                    <div class="icon-container blue">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </div>
                    <h2 class="card-title">Students List</h2>
                    <p class="card-description">View and manage all registered students</p>
                </div>
                <div class="card-content">
                    <button class="button blue" onclick="window.location.href = '/students'">View All Students</button>
                </div>
            </div>

            <!-- Quick Stats Card -->
            <div class="card">
                <div class="card-header">
                    <div class="icon-container purple">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                    </div>
                    <h2 class="card-title">Quick Stats</h2>
                    <p class="card-description">Overview of student data</p>
                </div>
                <div class="card-content">
                    <div class="stats">
                        <div class="stat-row">
                            <span class="stat-label">Total Students:</span>
                            <span class="stat-value">{{ count }}</span>
                        </div>
                      
                    </div>
                </div>
            </div>
        </div>
    </div>


</body>
</html>
