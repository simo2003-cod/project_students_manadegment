<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - Student Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            min-height: 98vh;
            background: linear-gradient(to bottom right, #f0fdf4, #d1fae5);
           
        }






        .back-button {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1rem;
            background: transparent;
            border: none;
            position: fixed;
            top: 20px;
            left: 35px;
            border-radius: 0.375rem;
            color: #374151;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background-color 0.2s ease;
        }

        .back-button:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .back-button svg {
            margin-right: 0.5rem;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 10px ;
            margin-bottom: 5px;
        }

        .header-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 3rem;
            height: 3rem;
            background-color: #16a34a;
            border-radius: 0.5rem;
        }

        .header-icon svg {
            width: 1.5rem;
            height: 1.5rem;
            color: white;
        }

        .header-text h1 {
            font-size: 1.875rem;
            color: #111827;
            font-weight: 700;
       
        }

        .header-text p {
            color: #4b5563;
            font-size: 0.875rem;
        }

        /* Card Styles */
        .card {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 60vw;
            margin: 0 auto;
        }

        .card-header {
            padding: 15px 1.5rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #111827;
            margin-bottom: 0.25rem;
        }

        .card-description {
            font-size: 0.875rem;
            color: #6b7280;
        }

        .card-content {
            padding: 10px 1.5rem;
        }



        /* Form Styles */
        .form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
        }

        .input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input:focus {
            outline: none;
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1);
        }

        .input.error {
            border-color: #ef4444;
        }

        .input.error:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .error-message {
            font-size: 0.875rem;
            color: #ef4444;
        }

        /* Button Styles */
        .button-group {
            display: flex;
            gap: 1rem;
        }

        .button {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .button-primary {
            flex: 1;
            background-color: #16a34a;
            color: white;
        }

        .button-primary:hover {
            background-color: #15803d;
        }

        .button-primary svg {
            width: 1rem;
            height: 1rem;
            margin-right: 0.5rem;
        }

        .button-secondary {
            padding: 0.5rem 1rem;
            background-color: white;
            color: #374151;
            border: 1px solid #d1d5db;
        }

        .button-secondary:hover {
            background-color: #f9fafb;
        }

        /* Quick Actions */
        .quick-actions {
            margin-top: 20px;
            text-align: center;
        }

        .link-button {
            background: transparent;
            border: none;
            color: #15803d;
            font-size: 0.875rem;
            cursor: pointer;
            padding: 0.5rem;
        }

        .link-button:hover {
            color: #166534;
        }
    </style>
</head>
<body>
   
    <div class="container">
        <!-- Header -->
        <div class="header">
            <button class="back-button" onclick="window.location.href='/'">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to Home
            </button>
            <div class="header-content">
                <div class="header-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <line x1="19" x2="19" y1="8" y2="14"></line>
                        <line x1="22" x2="16" y1="11" y2="11"></line>
                    </svg>
                </div>
                <div class="header-text">
                    <h1>Add New Student</h1>
                    <p>Fill in the student information below</p>
                </div>
            </div>
        </div>

        <!-- Form Card -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Student Information</h2>
                <p class="card-description">Enter the details of the new student</p>
            </div>
            <div class="card-content">
                <!-- Form -->
                <form id="studentForm" class="form" action="/add_student" method="post">
                    <!-- Name Field -->
                    <div class="form-group">
                        <label for="name" class="label">Name *</label>
                        <input
                            type="text"
                            id="name"
                            class="input"
                            placeholder="Enter student name"
                            name="name"
                        >
                        <span id="nameError" class="error-message"></span>
                    </div>

                    <!-- Email Field -->
                    <div class="form-group">
                        <label for="email" class="label">Email *</label>
                        <input
                            type="email"
                            id="email"
                            class="input"
                            placeholder="Enter student email"
                            name="email"
                        >
                        <span id="emailError" class="error-message"></span>
                    </div>

                    <!-- Age Field -->
                    <div class="form-group">
                        <label for="age" class="label">Age *</label>
                        <input
                            type="number"
                            id="age"
                            class="input"
                            placeholder="Enter student age"
                            name="age"
                        >
                        <span id="ageError" class="error-message"></span>
                    </div>

                    <!-- Submit Button -->
                    <div class="button-group">
                        <button type="submit" class="button button-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <line x1="19" x2="19" y1="8" y2="14"></line>
                                <line x1="22" x2="16" y1="11" y2="11"></line>
                            </svg>
                            Add Student
                        </button>
                        <button type="button" class="button button-secondary" onclick="clearForm()">
                            Clear Form
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <button class="link-button" onclick="window.location.href = '/students'">
                View all students →
            </button>
        </div>
    </div>

     <script>
// Get form elements
const form = document.getElementById('studentForm');
const nameInput = document.getElementById('name');
const emailInput = document.getElementById('email');
const ageInput = document.getElementById('age');

// Get error message elements
const nameError = document.getElementById('nameError');
const emailError = document.getElementById('emailError');
const ageError = document.getElementById('ageError');

// Clear error when user starts typing
function clearError(fieldName) {
    if (fieldName === 'name') {
        nameInput.classList.remove('error');
        nameError.textContent = '';
    } else if (fieldName === 'email') {
        emailInput.classList.remove('error');
        emailError.textContent = '';
    } else if (fieldName === 'age') {
        ageInput.classList.remove('error');
        ageError.textContent = '';
    }
}

// Validate name field
function validateName() {
    const name = nameInput.value.trim();
    
    // Check if name is empty
    if (!name) {
        nameInput.classList.add('error');
        nameError.textContent = 'Name is required';
        return false;
    }
    
    // Check if name contains only letters and spaces
    if (!/^[a-zA-Z ]+$/.test(name)) {
        nameInput.classList.add('error');
        nameError.textContent = 'Please enter a valid name';
        return false;
    }
    
    return true;
}

// Validate email field
function validateEmail() {
    const email = emailInput.value.trim();
    
    // Check if email is empty
    if (!email) {
        emailInput.classList.add('error');
        emailError.textContent = 'Email is required';
        return false;
    }
    
    // Check if email format is valid
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        emailInput.classList.add('error');
        emailError.textContent = 'Please enter a valid email';
        return false;
    }
    
    return true;
}

// Validate age field
function validateAge() {
    const age = ageInput.value;
    
    // Check if age is empty
    if (!age) {
        ageInput.classList.add('error');
        ageError.textContent = 'Age is required';
        return false;
    }
    
    // Check if age is between 1 and 100
    const ageNumber = parseInt(age);
    if (ageNumber < 1 || ageNumber > 100) {
        ageInput.classList.add('error');
        ageError.textContent = 'Please enter a valid age (1-100)';
        return false;
    }
    
    return true;
}

// Validate entire form
function validateForm() {
    // Clear all errors first
    clearError('name');
    clearError('email');
    clearError('age');
    
    // Validate all fields
    const nameValid = validateName();
    const emailValid = validateEmail();
    const ageValid = validateAge();
    
    // Return true only if all fields are valid
    return nameValid && emailValid && ageValid;
}

// Add event listeners to clear errors when user types
nameInput.addEventListener('input', () => clearError('name'));
emailInput.addEventListener('input', () => clearError('email'));
ageInput.addEventListener('input', () => clearError('age'));

// Handle form submission
form.addEventListener('submit', function(e) {
    // Prevent form submission if validation fails
    if (!validateForm()) {
        e.preventDefault();
    }
});
// clear form
function clearForm(){
    nameInput.value = ''
    emailInput.value=''
    ageInput.value=''

    clearError('name')
    clearError('email')
    clearError('age')
}


    </script>
</body>
</html>
